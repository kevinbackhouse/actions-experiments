name: Publish (reusable workflow)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version number or tag for the release. For example: v1.0.1'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: true
        type: string
      repository_url:
        description: 'This is the repository-url parameter for pypa/gh-action-pypi-publish'
        required: true
        type: string
      environment:
        description: 'Environment that specifies the PyPI/TestPyPI url'
        type: string
        required: true
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: write
  id-token: write  # For trusted publishing

jobs:
  publish:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
    - name: Debug
      env:
        MESSAGE: ${{ inputs.environment }}
      run: |
        echo $MESSAGE
