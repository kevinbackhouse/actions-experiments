name: Test001

on:
  workflow_call:
    inputs:
      pr_id:
        description: Pull request ID
        required: true
        type: number
      sha:
        description: Commit ID
        required: true
        type: string
  push:
    branches:
      - main

jobs:
  doit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: checkout on push
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: checkout on workflow_call
        if: inputs.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: set upstream branch on workflow_call
        if: inputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ID: ${{ inputs.pr_id }}
        run: |
          export PR_INFO=$(gh api "repos/{owner}/{repo}/pulls/$PR_ID" --jq '{url: .head.repo.clone_url, branch: .head.ref}')
          export CLONE_URL=$(echo $PR_INFO | jq -r '.url')
          export BRANCH=$(echo $PR_INFO | jq -r '.branch')
          git checkout -b $BRANCH
          git remote add other $CLONE_URL
          git fetch other
          git branch --set-upstream-to=other/$BRANCH

      - name: test pushing to the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"

          # Remove trailing whitespace from README.md. This operation
          # is idempotent, so it won't cause an infinite loop in the
          # "on push" trigger.
          sed -i 's/[[:blank:]]*$//' README.md

          git add README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "remove trailing whitespace"
            git push
          fi
