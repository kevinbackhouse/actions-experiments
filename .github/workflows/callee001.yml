name: Test001

on:
  workflow_call:
    inputs:
      pr_id:
        description: Pull request ID
        required: true
        type: number
      sha:
        description: Commit ID
        required: true
        type: string
  push:
    branches:
      - main

jobs:
  doit:
    runs-on: ubuntu-latest
    steps:
      - name: checkout on push
        if: github.event_name == 'push'
        uses: actions/checkout@v7  

      - name: checkout on workflow_run
        if: github.event_name != 'push'
        uses: actions/checkout@v7  
        with:
          ref: ${{ github.event.inputs.sha }}

      - name: debug
        run: |
          git status
